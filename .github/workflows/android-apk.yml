name: Android test APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'capacitor.config.json'
      - 'scripts/prepare-mobile.mjs'
      - 'scripts/generate-android-icon.py'
      - 'scripts/configure-android-oauth.py'
      - 'supabase-app.js'
      - 'auth-client.js'
      - 'index.html'
      - 'profi-icon.svg'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" || test -x "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Prepare mobile web assets
        run: npm run mobile:prepare
      - name: Generate Android project
        run: npx cap add android
      - name: Register Android OAuth callback
        run: |
          python3 scripts/configure-android-oauth.py
      - name: Sync Android project
        run: npx cap sync android
      - name: Create branded Android icon
        run: |
          python3 -m pip install --user Pillow CairoSVG
          python3 scripts/generate-android-icon.py
      - name: Build test APK
        working-directory: android
        run: bash ./gradlew assembleDebug --no-daemon
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: ProfiUZ-Android-Test-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
