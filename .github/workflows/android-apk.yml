name: Android signed APK and updates

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'capacitor.config.json'
      - 'scripts/prepare-mobile.mjs'
      - 'scripts/generate-android-icon.py'
      - 'scripts/configure-android-oauth.py'
      - 'supabase-app.js'
      - 'auth-client.js'
      - 'mobile-updates.js'
      - 'index.html'
      - '*.js'
      - '*.css'
      - '*.html'
      - 'profi-icon.svg'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" || test -x "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Prepare mobile web assets
        run: npm run mobile:prepare
      - name: Generate Android project
        run: npx cap add android
      - name: Register Android OAuth callback
        run: |
          python3 scripts/configure-android-oauth.py
      - name: Sync Android project
        run: npx cap sync android
      - name: Create branded Android icon
        run: |
          python3 -m pip install --user Pillow CairoSVG
          python3 scripts/generate-android-icon.py
      - name: Set Android version from package
        run: |
          python3 - <<'PY'
          import json,re,pathlib
          version=json.loads(pathlib.Path("package.json").read_text())["version"]
          code=20000+int("${{ github.run_number }}")
          gradle=pathlib.Path("android/app/build.gradle")
          src=gradle.read_text()
          src,n=re.subn(r'versionCode\s+\d+',f'versionCode {code}',src,count=1)
          if n!=1: raise RuntimeError("Android versionCode not found")
          src,n=re.subn(r'versionName\s+"[^"]+"',f'versionName "{version}"',src,count=1)
          if n!=1: raise RuntimeError("Android versionName not found")
          gradle.write_text(src)
          print("Android version:",version,"build:",code)
          PY
      - name: Configure stable Android signing
        env:
          PROFI_ANDROID_KEYSTORE_BASE64: ${{ secrets.PROFI_ANDROID_KEYSTORE_BASE64 }}
          PROFI_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.PROFI_ANDROID_KEYSTORE_PASSWORD }}
          PROFI_ANDROID_KEY_ALIAS: ${{ secrets.PROFI_ANDROID_KEY_ALIAS }}
          PROFI_ANDROID_KEY_PASSWORD: ${{ secrets.PROFI_ANDROID_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os,base64,pathlib
          keys=("PROFI_ANDROID_KEYSTORE_BASE64","PROFI_ANDROID_KEYSTORE_PASSWORD","PROFI_ANDROID_KEY_ALIAS","PROFI_ANDROID_KEY_PASSWORD")
          if not all(os.getenv(k) for k in keys):
              raise SystemExit("Stable signing not configured: add all four PROFI_ANDROID_* GitHub Actions secrets. An unsigned or ephemeral-debug APK cannot safely update existing installations.")
          store=pathlib.Path("android/app/profi-release.jks")
          store.write_bytes(base64.b64decode(os.environ["PROFI_ANDROID_KEYSTORE_BASE64"],validate=True))
          gradle=pathlib.Path("android/app/build.gradle")
          src=gradle.read_text()
          if "signingConfigs {" not in src:
              src=src.replace("android {", """android {
              signingConfigs {
                  profiRelease {
                      storeFile file('profi-release.jks')
                      storePassword System.getenv('PROFI_ANDROID_KEYSTORE_PASSWORD')
                      keyAlias System.getenv('PROFI_ANDROID_KEY_ALIAS')
                      keyPassword System.getenv('PROFI_ANDROID_KEY_PASSWORD')
                  }
              }
          """,1)
          if "release {" not in src:
              raise SystemExit("Android release build type not found")
          src=src.replace("release {","release {\\n            signingConfig signingConfigs.profiRelease",1)
          if "signingConfig signingConfigs.profiRelease" not in src:
              raise SystemExit("Could not configure release signing")
          gradle.write_text(src)
          PY
      - name: Build updateable signed APK
        working-directory: android
        env:
          PROFI_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.PROFI_ANDROID_KEYSTORE_PASSWORD }}
          PROFI_ANDROID_KEY_ALIAS: ${{ secrets.PROFI_ANDROID_KEY_ALIAS }}
          PROFI_ANDROID_KEY_PASSWORD: ${{ secrets.PROFI_ANDROID_KEY_PASSWORD }}
        run: bash ./gradlew assembleRelease --no-daemon
      - name: Publish APK for in-app update checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$((20000 + ${{ github.run_number }}))
          tag="android-${code}"
          cp android/app/build/outputs/apk/release/app-release.apk "Profi.UZ-${code}.apk"
          gh release create "$tag" "Profi.UZ-${code}.apk" --title "Profi.UZ Android build ${code}" --notes "Signed Android update. Install over an earlier version signed with the same key." --latest
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: ProfiUZ-Android-Signed-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
